[project]
name = "hyperstore-mcp"
version = "0.1.0"
description = "MCP server for HyperStore — discover 1000+ AI apps from any LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "HyperGPT", email = "hello@hypergpt.ai" },
]
keywords = ["mcp", "llm", "ai", "hyperstore", "hypergpt", "directory", "marketplace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "anyio>=4.3.0",
]

[project.optional-dependencies]
http = [
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
    "pyright>=1.1.360",
]

[project.urls]
Homepage = "https://store.hypergpt.ai"
Repository = "https://github.com/deficlow/HyperStore-MCP"
Issues = "https://github.com/deficlow/HyperStore-MCP/issues"
"MCP Endpoint" = "https://mcp.store.hypergpt.ai"

[project.scripts]
hyperstore-mcp = "hyperstore_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperstore_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hyperstore_mcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
